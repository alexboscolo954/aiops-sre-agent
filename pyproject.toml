[project]
name = "aiops-sre-agent"
version = "0.1.0"
description = "Alert triage agent for Kubernetes: LangChain + MCP tools, human approval for every write"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # langchain.mcp is beta: exact pins, bump deliberately.
    "langchain[mcp,anthropic,openai]==1.4.4",
    "fastmcp==4.1.0",
    "kubernetes==37.0.1",
    "httpx==0.28.1",
    "cryptography==50.0.2",  # signs the Google service account assertion
    "websockets==16.1.1",  # Slack Socket Mode
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "python-dotenv==1.2.4",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "jinja2==3.1.6",
    "cronsim==2.7",
    "markdown-it-py==4.2.0",
]

[project.scripts]
aiops = "aiops_agent.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real cluster (kind in CI)"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore::langchain_core._api.beta_decorator.LangChainBetaWarning"]
