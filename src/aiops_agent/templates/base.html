<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}aiops{% endblock %}</title>
  <link rel="stylesheet" href="/console/console.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="/console">aiops</a>
    <nav>
      <a href="/console">Investigations</a>
      <a href="/console/teachings">Teachings</a>
      <a href="/console/health">Health</a>
      <a href="/app/">Workloads</a>
      <a href="/console/token">Approver token</a>
    </nav>
    <span class="who">signed in as {{ name }} (<code>{{ login }}</code>)</span>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
