# Opt-in, by the client: let the Relay run the Hub's two write tools (evict a pod,
# scale a deployment), each still approved by the Operator on the Hub. Without this
# overlay the Relay offers no write tool at all. Apply with: kubectl apply -k deploy/relay-actions
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../relay
  - rbac-actions.yaml
patches:
  - target: {kind: Deployment, name: squero-relay}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: SQUERO_RELAY_WRITES, value: "true"}
