# Only what evict_pod and scale_deployment need, per namespace. Deliberately NOT
# `patch deployments`: that would let the agent change images and commands.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squero-relay-actions
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: ["apps"]
    resources: [deployments/scale]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squero-relay-actions
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squero-relay-actions
subjects:
  - kind: ServiceAccount
    name: squero-relay
    namespace: squero-relay
