# The Hub on one machine (a VM or a laptop): Hub + Postgres + Caddy + nightly backups.
# Setup and day-to-day use: README "Running the Hub". Compose reads .env here
# (see env.example); the Hub reads hub.env (see hub.env.example).
name: aiops

services:
  hub:
    image: ${AIOPS_IMAGE:-ghcr.io/alexboscolo954/aiops-sre-agent:0.3.0}
    command: [serve, --host, 0.0.0.0, --port, "8080"]
    env_file: hub.env
    environment:
      AIOPS_CONTRACTS_DIR: /contracts
      AIOPS_DATABASE_URL: postgresql://aiops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/aiops
      SOPS_AGE_KEY_FILE: /age/keys.txt
      HOME: /tmp
    volumes:
      - ${AIOPS_CONTRACTS:-./contracts}:/contracts:ro
      - ${AIOPS_AGE_KEYS:-./age-keys.txt}:/age/keys.txt:ro   # owned by uid 10001, mode 0400
    ports:
      # Investigations and approvals: this host only, reached through `tailscale
      # serve`. Docker-published ports bypass host firewalls: never publish it wider.
      - "127.0.0.1:${AIOPS_LOCAL_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 5s
      retries: 24
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aiops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "aiops"]
      interval: 5s
      retries: 24
    restart: unless-stopped

  caddy:
    # The only public entry point: TLS, and nothing but the alert route (Caddyfile).
    image: caddy:2.11.4
    environment:
      AIOPS_DOMAIN: ${AIOPS_DOMAIN:-localhost}
    ports:
      - "${AIOPS_HTTP_PORT:-80}:80"
      - "${AIOPS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [hub]
    restart: unless-stopped

  backup:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    entrypoint: [/backup.sh]
    environment:
      PGHOST: postgres
      PGUSER: aiops
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: aiops
      KEEP_DAYS: "14"
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${AIOPS_BACKUPS:-./backups}:/backups
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
