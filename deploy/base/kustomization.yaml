apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global namespace: RoleBindings must live in the namespaces they grant.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
configMapGenerator:
  - name: aiops-contract
    namespace: aiops
    files: [contract.yaml]
# Create the secret out of band (External Secrets, sealed-secrets, Vault):
#   kubectl -n aiops create secret generic aiops-secrets \
#     --from-literal=AIOPS_APPROVER_TOKEN=... --from-literal=AIOPS_MODEL_API_KEY=... \
#     --from-literal=AIOPS_DATABASE_URL=postgresql://user:pass@host:5432/aiops \
#     [--from-literal=AIOPS_SLACK_WEBHOOK_URL=...]
