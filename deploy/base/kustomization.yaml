apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global namespace: RoleBindings must live in the namespaces they grant.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
configMapGenerator:
  - name: squero-contract
    namespace: squero
    files: [contract.yaml]
# Create the secret out of band (External Secrets, sealed-secrets, Vault):
#   kubectl -n squero create secret generic squero-secrets \
#     --from-literal=SQUERO_APPROVER_TOKEN=... --from-literal=SQUERO_MODEL_API_KEY=... \
#     --from-literal=SQUERO_DATABASE_URL=postgresql://user:pass@host:5432/squero \
#     [--from-literal=SQUERO_SLACK_BOT_TOKEN=xoxb-...] \
#     [--from-literal=SQUERO_SLACK_APP_TOKEN=xapp-... --from-literal=SQUERO_SLACK_OPERATOR_ID=U...]
