apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-relay
  namespace: aiops-relay
  labels: {app: aiops-relay}
spec:
  replicas: 1                 # one live connection per token: a second would replace the first
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aiops-relay}
  template:
    metadata:
      labels: {app: aiops-relay}
    spec:
      serviceAccountName: aiops-relay
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: ghcr.io/alexboscolo954/aiops-sre-agent:0.31.0
          args: [relay]
          env:
            - {name: HOME, value: /tmp}   # read-only root fs
            - {name: AIOPS_RELAY_HUB, value: "wss://hub.example.com/relay"}
            - {name: AIOPS_RELAY_CLUSTER, value: "demo"}          # its name in the Contract
            - {name: AIOPS_RELAY_NAMESPACES, value: '["demo"]'}   # as the RoleBindings grant
            # - {name: AIOPS_RELAY_PROMETHEUS_URL, value: "http://prometheus.monitoring:9090"}
            # Writes stay off unless deploy/relay-actions turns them on.
          envFrom:
            - secretRef: {name: aiops-relay}   # AIOPS_RELAY_TOKEN
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
