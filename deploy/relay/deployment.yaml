apiVersion: apps/v1
kind: Deployment
metadata:
  name: squero-relay
  namespace: squero-relay
  labels: {app: squero-relay}
spec:
  replicas: 1                 # one live connection per token: a second would replace the first
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: squero-relay}
  template:
    metadata:
      labels: {app: squero-relay}
    spec:
      serviceAccountName: squero-relay
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          image: ghcr.io/alexboscolo954/squero:0.42.0
          args: [relay]
          env:
            - {name: HOME, value: /tmp}   # read-only root fs
            - {name: SQUERO_RELAY_HUB, value: "wss://hub.example.com/relay"}
            - {name: SQUERO_RELAY_CLUSTER, value: "demo"}          # its name in the Contract
            - {name: SQUERO_RELAY_NAMESPACES, value: '["demo"]'}   # as the RoleBindings grant
            # - {name: SQUERO_RELAY_PROMETHEUS_URL, value: "http://prometheus.monitoring:9090"}
            # Writes stay off unless deploy/relay-actions turns them on.
          envFrom:
            - secretRef: {name: squero-relay}   # SQUERO_RELAY_TOKEN
          ports:
            - {name: alerts, containerPort: 8080}   # its Alertmanager receiver (SQUERO_RELAY_ALERTS_PORT)
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# The cluster's Alertmanager posts here (slice 3.4): POST /alertmanager with the
# Contract's webhook token as its bearer credentials, as it would to the Hub.
apiVersion: v1
kind: Service
metadata:
  name: squero-relay
  namespace: squero-relay
  labels: {app: squero-relay}
spec:
  selector: {app: squero-relay}
  ports:
    - {name: alerts, port: 8080, targetPort: alerts}
