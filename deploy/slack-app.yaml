# Slack app manifest for the Hub: api.slack.com/apps > Create New App > From a manifest.
# Slice 1.1 only posts, so the bot needs chat:write. Slice 1.2 adds Socket Mode and
# interactivity for the approve / reject buttons.
display_information:
  name: aiops
  description: Investigations and approvals for every Contract
features:
  bot_user:
    display_name: aiops
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
