# Slack app manifest for the Hub: api.slack.com/apps > Create New App > From a manifest.
# The bot posts (chat:write, which also covers the "only the Operator" notes) and
# opens the reject modal. Clicks arrive over Socket Mode, so the Hub needs no public
# Slack endpoint. After creating the app: Basic Information > App-Level Tokens >
# generate one with connections:write, and set it as AIOPS_SLACK_APP_TOKEN.
display_information:
  name: aiops
  description: Investigations and approvals for every Contract
features:
  bot_user:
    display_name: aiops
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  token_rotation_enabled: false
