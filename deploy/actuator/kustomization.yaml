# The Actuator (Phase 12), applied in the CLIENT's cluster: it pulls the Approved Sizings
# of its Contract's cluster from the Hub and resizes pods in place. Nothing reaches it
# from outside the cluster. Apply with: kubectl apply -k deploy/actuator
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global namespace: RoleBindings must live in the namespaces they grant.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - webhook.yaml
# Create the token's Secret out of band (the value is the Contract's actuator_token_secret,
# never the Relay's):
#   kubectl -n aiops-actuator create secret generic aiops-actuator --from-literal=AIOPS_ACTUATOR_TOKEN=...
