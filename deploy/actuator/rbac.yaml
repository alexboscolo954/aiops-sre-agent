# The Actuator's writes are pod resizes (pods/resize: requests and limits only, never an
# image or a command), pod evictions (pods/eviction, used only when the Contract turns
# eviction on, through the Eviction API so PodDisruptionBudgets hold), Events, and its own
# ConfigMap. It never patches a workload (Deployment, StatefulSet, DaemonSet, Argo Rollout,
# CronJob, Job): it only reads them.
# Bound per namespace with RoleBindings: the Contract's namespaces on this cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: squero-actuator
  namespace: squero-actuator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: squero-actuator-resize
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]   # slice 12.7: only an Infeasible pod, in the Contract's windows
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list]   # slice 12.8b: none installed is none
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]   # slice 12.8c: a CronJob's template, and its runs to watch
  # What would refuse or fight a resize (slice 12.3): read only.
  - apiGroups: [""]
    resources: [limitranges, resourcequotas]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [autoscaling.k8s.io]
    resources: [verticalpodautoscalers]
    verbs: [get, list]
  # Before an eviction (slice 12.7): only a pod a PodDisruptionBudget covers is evicted.
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
---
# Its own webhook's caBundle, at each start: that one object only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: squero-actuator-webhook
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [squero-actuator]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: squero-actuator-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: squero-actuator-webhook
subjects:
  - kind: ServiceAccount
    name: squero-actuator
    namespace: squero-actuator
---
# One RoleBinding per namespace of the Contract's cluster. Copy for each.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squero-actuator-resize
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: squero-actuator-resize
subjects:
  - kind: ServiceAccount
    name: squero-actuator
    namespace: squero-actuator
---
# Slice 13.1a, for the Contract's `reflexes.oom`: a Node's Events are in `default`, and the
# kubelet's `SystemOOM` one there tells an OOM kill of a node out of memory from one at a
# container's own limit. It reads every Event in `default`, so those of anything that runs
# there too: a client who would not grant that deletes this Role and its RoleBinding, and
# an OOM kill of a container with a memory limit then counts as container-limit (the
# Actuator says once that it could not read them).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squero-actuator-node-events
  namespace: default
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squero-actuator-node-events
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squero-actuator-node-events
subjects:
  - kind: ServiceAccount
    name: squero-actuator
    namespace: squero-actuator
---
# What it applied, in its own namespace: one ConfigMap, read and replaced by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squero-actuator-state
  namespace: squero-actuator
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [squero-actuator]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]   # RBAC can't limit create by name
  - apiGroups: [""]
    resources: [events]
    verbs: [create]   # on its ConfigMap: the Hub unreachable for 15 minutes (slice 12.5)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squero-actuator-state
  namespace: squero-actuator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: squero-actuator-state
subjects:
  - kind: ServiceAccount
    name: squero-actuator
    namespace: squero-actuator
