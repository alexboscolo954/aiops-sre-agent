apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-actuator
  namespace: aiops-actuator
  labels: {app: aiops-actuator}
spec:
  replicas: 1                 # one writer per cluster
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aiops-actuator}
  template:
    metadata:
      labels: {app: aiops-actuator}
    spec:
      serviceAccountName: aiops-actuator
      automountServiceAccountToken: true
      enableServiceLinks: false   # a Service named aiops-actuator would set AIOPS_ACTUATOR_PORT
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: actuator
          image: ghcr.io/alexboscolo954/aiops-sre-agent:0.35.0
          args: [actuator]
          env:
            - {name: HOME, value: /tmp}   # read-only root fs
            - {name: AIOPS_ACTUATOR_HUB, value: "https://hub.example.com"}
            - name: AIOPS_ACTUATOR_NAMESPACE   # where its ConfigMap lives
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          envFrom:
            - secretRef: {name: aiops-actuator}   # AIOPS_ACTUATOR_TOKEN
          ports:
            - {name: webhook, containerPort: 8443}   # the API server calls it as new pods are created
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# The API server reaches its webhook here; the Actuator's own certificate names this
# Service (aiops-actuator.aiops-actuator.svc).
apiVersion: v1
kind: Service
metadata:
  name: aiops-actuator
  namespace: aiops-actuator
  labels: {app: aiops-actuator}
spec:
  selector: {app: aiops-actuator}
  ports:
    - {name: webhook, port: 443, targetPort: webhook}
