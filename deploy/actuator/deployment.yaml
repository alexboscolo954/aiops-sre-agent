apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-actuator
  namespace: aiops-actuator
  labels: {app: aiops-actuator}
spec:
  replicas: 1                 # one writer per cluster
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aiops-actuator}
  template:
    metadata:
      labels: {app: aiops-actuator}
    spec:
      serviceAccountName: aiops-actuator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: actuator
          image: ghcr.io/alexboscolo954/aiops-sre-agent:0.33.0
          args: [actuator]
          env:
            - {name: HOME, value: /tmp}   # read-only root fs
            - {name: AIOPS_ACTUATOR_HUB, value: "https://hub.example.com"}
            - name: AIOPS_ACTUATOR_NAMESPACE   # where its ConfigMap lives
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          envFrom:
            - secretRef: {name: aiops-actuator}   # AIOPS_ACTUATOR_TOKEN
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
