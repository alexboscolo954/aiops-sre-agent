# Opt-in: let the agent restart / scale deployments (each call still needs
# human approval). Apply with: kubectl apply -k deploy/actions
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - rbac-actions.yaml
configMapGenerator:
  - name: aiops-contract       # the same Contract with enable_actions: true
    namespace: aiops
    behavior: replace
    files: [contract.yaml]
