# Alertmanager config snippet: send alerts to the agent.
receivers:
  - name: aiops-agent
    webhook_configs:
      - url: http://aiops-agent.aiops:8080/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/aiops-token
route:
  routes:
    - receiver: aiops-agent
      matchers: ['severity=~"warning|critical"']
      continue: true          # keep paging humans as before
