# Synthetic demo Contract for tests and the kind demo. Real Contracts live in the
# private contracts repo (docs/adr/0003-contract-data-in-private-git.md).
id: demo-shop
name: Demo shop
clusters:
  - name: kind
    context: kind-aiops
    namespaces: [demo, orders]
    gitops_namespaces: [argocd, flux-system]  # stand-in CRDs on kind (demo/gitops.sh)
integrations:
  - name: kubernetes
  - name: prometheus
    url: http://localhost:9090
    token_secret: prometheus-token
  - name: runbooks
  - name: incidents
# Masked for the LLM (README: Masking): placeholders keyed with its mask-key secret
data_policy:
  mask:
    terms: [shop.example]
# Sizing policies (aiops sizing show). Built-ins: production (the default),
# high-availability, batch (every Job and CronJob unless a rule says otherwise), off.
sizing:
  policies:
    lean-agent:  # a DaemonSet runs on every node: every MiB counts
      base: production
      cpu: {headroom: 0.10}
      memory: {headroom: 0.10, max: 256Mi}
  rules:  # top to bottom, the first match wins; namespace and name take globs
    - {namespace: lab, name: db, policy: high-availability}
    - {namespace: lab, kind: DaemonSet, policy: lean-agent}
    - {namespace: lab, name: idle, policy: off}
