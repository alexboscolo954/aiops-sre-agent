# Three workloads that fail in three classic ways. `make demo` applies them,
# then breaks checkout with a config rollout so its history shows the change.
# In namespace orders, a fourth breaks because a different workload changed:
# `make demo` rolls inventory to API v2 and orders-api, which calls it, crash loops.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# demo-bank's namespace on the same cluster, so isolation tests run against a real API.
apiVersion: v1
kind: Namespace
metadata:
  name: bank
---
# 1. Crash loop after a bad rollout: revision 2 drops a required env var.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import os, sys, time
              print("checkout starting, version 1.4.0")
              url = os.environ.get("DATABASE_URL")
              if not url:
                  print("FATAL: required env var DATABASE_URL is not set", file=sys.stderr)
                  sys.exit(1)
              print("connected to database"); time.sleep(10**6)
          env:
            - {name: DATABASE_URL, value: "postgres://checkout@db.demo:5432/shop"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
# 2. OOM killed: the batch job needs ~200Mi, the limit is 48Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: reports}
  template:
    metadata:
      labels: {app: reports}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              print("building monthly report: loading 200MB of rows")
              rows = bytearray(200 * 1024 * 1024)
              print("report done"); time.sleep(10**6)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 48Mi}
---
# 3. Image pull failure: the tag was never pushed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: web
          image: nginx:1.99.99-does-not-exist
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
# 4. A dependency's rollout: inventory v2 moves /stock to /v2/stock and still looks
# healthy (its probe is TCP); orders-api, unchanged, gets 404 and exits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import http.server, os
              path = "/v2/stock" if os.environ.get("API_VERSION") == "v2" else "/stock"
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      found = self.path == path
                      self.send_response(200 if found else 404); self.end_headers()
                      self.wfile.write(b'{"sku-1": 12}' if found else b'{"error": "not found"}')
                  def log_message(self, *args): pass
              print("inventory serving", path)
              http.server.HTTPServer(("", 8080), H).serve_forever()
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: orders
spec:
  selector: {app: inventory}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import os, sys, time, urllib.error, urllib.request
              url = os.environ["INVENTORY_URL"] + "/stock"
              print("orders-api starting, version 2.3.0")
              while True:
                  try:
                      urllib.request.urlopen(url, timeout=3).read()
                  except urllib.error.HTTPError as e:
                      print(f"FATAL: stock sync failed: GET {url}: {e}", file=sys.stderr)
                      sys.exit(1)
                  except OSError as e:  # inventory still starting
                      print(f"stock sync retry: {e}"); time.sleep(2); continue
                  print("stock synced"); time.sleep(5)
          env:
            - {name: INVENTORY_URL, value: "http://inventory.orders:8080"}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
