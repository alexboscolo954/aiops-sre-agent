name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: make lint
      - run: make test

  integration:
    # Real MCP tools + a scripted agent run against broken workloads on kind.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - uses: helm/kind-action@v1
        with:
          cluster_name: aiops
          config: demo/kind.yaml
      - run: make demo
      - run: make integration
        env:
          AIOPS_RECORD_DIR: recordings
      - run: make deploy-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recordings
          path: recordings/
          if-no-files-found: ignore
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n aiops logs deploy/aiops-agent --tail=100 || true

  publish:
    # Image for deploy/: ghcr.io/alexboscolo954/aiops-sre-agent:<version>, on tags only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4   # arm64 build on an amd64 runner
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
