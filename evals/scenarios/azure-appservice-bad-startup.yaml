description: 'A Contract with Azure only: a Linux App Service web app worked until its startup command
  was changed, then served 5xx. Recorded from a sandbox subscription (evals/record_azure.py).'
clusters: {}
integrations:
- name: azure
  vendor: azure
  tools:
    group_resource_list: read
    appservice_webapp_get: read
    monitor_activitylog_list: read
    monitor_metrics_definitions: read
    monitor_metrics_query: read
    resourcehealth_availability-status_get: read
alert:
  status: firing
  commonLabels:
    alertname: AppServiceHttp5xx
    app: shop-web
  alerts:
  - status: firing
    labels:
      alertname: AppServiceHttp5xx
      resource_group: shop-prod-rg
      app: shop-web
      severity: critical
    annotations:
      summary: More than half of the requests to App Service shop-web return 5xx.
expect:
  category:
  - bad_config
  - bad_rollout
  keywords:
  - config
  - '15:50'
  max_tool_calls: 12
tools:
  azure_group_resource_list:
  - match:
      resource-group: shop-prod-rg
    result:
      status: 200
      message: Success
      results:
        resources:
        - name: aiops-plan
          id: /subscriptions/00000000-0000-0000-0000-00000000a001/resourceGroups/shop-prod-rg/providers/Microsoft.Web/serverFarms/aiops-plan
          type: Microsoft.Web/serverFarms
          location: centralus
        - name: shop-web
          id: /subscriptions/00000000-0000-0000-0000-00000000a001/resourceGroups/shop-prod-rg/providers/Microsoft.Web/sites/shop-web
          type: Microsoft.Web/sites
          location: centralus
      duration: 0
  azure_appservice_webapp_get:
  - match:
      app: shop-web
    result:
      status: 200
      message: Success
      results:
        Webapps:
        - name: shop-web
          type: Microsoft.Web/sites
          location: centralus
          kind: app,linux
          enabled: true
          state: Running
          resourceGroup: shop-prod-rg
          hostNames:
          - shop-web.azurewebsites.net
          lastModifiedTimeUtc: '2026-10-18T15:50:55.8833333+00:00'
          sku: Basic
      duration: 0
