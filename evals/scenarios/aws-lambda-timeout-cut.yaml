description: 'A Contract with AWS only: the checkout Lambda function worked until its timeout was cut
  from 10 s to 1 s, below its 1.2 s inventory lookup; then every call timed out. Recorded from a sandbox
  account (evals/record_aws.py).'
clusters: {}
integrations:
- aws
alert:
  status: firing
  commonLabels:
    alertname: checkout-errors
    function_name: checkout
  alerts:
  - status: firing
    labels:
      alertname: checkout-errors
      function_name: checkout
      severity: critical
    annotations:
      summary: Lambda function checkout reports errors (CloudWatch alarm checkout-errors).
expect:
  category:
  - bad_config
  - bad_rollout
  keywords:
  - timeout
  - '1.2'
  max_tool_calls: 12
tools:
  aws_describe_alarms:
  - match: {}
    result:
    - AlarmName: checkout-errors
      StateValue: ALARM
      StateReason: 'Threshold Crossed: 1 datapoint [1.0 (19/10/26 02:48:00)] was greater than the threshold
        (0.0).'
      StateUpdatedTimestamp: 1792378151.9
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value: checkout
      Statistic: Sum
      Period: 60
      Threshold: 0.0
      ComparisonOperator: GreaterThanThreshold
  aws_list_metrics:
