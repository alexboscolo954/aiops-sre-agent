description: 'A Contract with Google Cloud only: the checkout Cloud Run service worked until a new revision
  set its inventory timeout to 1 ms, then answered 503. Recorded from a sandbox project (evals/record_gcp.py).'
clusters: {}
integrations:
- name: gcp
  vendor: gcp
  tools:
    list_log_names: read
    list_log_entries: read
    list_metric_descriptors: read
    list_timeseries: read
    query_range: read
  env:
    GOOGLE_CLOUD_PROJECT: shop-prod-4f2a
alert:
  status: firing
  commonLabels:
    alertname: CloudRunHigh5xx
    service_name: checkout
  alerts:
  - status: firing
    labels:
      alertname: CloudRunHigh5xx
      service_name: checkout
      severity: critical
    annotations:
      summary: More than half of the requests to Cloud Run service checkout return 5xx.
expect:
  category:
  - bad_config
  - bad_rollout
  keywords:
  - timeout
  - '00002'
  max_tool_calls: 12
