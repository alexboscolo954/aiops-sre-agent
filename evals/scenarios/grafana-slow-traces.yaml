description: 'A Contract with Grafana only: product pages are slow, the logs say only that, and the traces
  show which span takes the time. Recorded from the kind demo (make lgtm).'
clusters: {}
integrations:
- name: grafana
  vendor: grafana
  tools:
    list_datasources: read
    list_loki_label_names: read
    list_loki_label_values: read
    query_loki_stats: read
    query_loki_patterns: read
    query_loki_logs: read
    search_tempo_traces: read
    get_tempo_trace: read
    list_tempo_attribute_values: read
alert:
  status: firing
  commonLabels:
    alertname: StorefrontHighLatency
    service_name: storefront
  alerts:
  - status: firing
    labels:
      alertname: StorefrontHighLatency
      service_name: storefront
      severity: warning
    annotations:
      summary: p99 latency of GET /product/{sku} is above 2s.
expect:
  category:
  - dependency_failure
  - app_error
  - capacity
  keywords:
  - inventory
  max_tool_calls: 10
tools:
  grafana_list_datasources:
  - match: {}
    result:
      datasources:
      - id: 3
        uid: loki
        name: Loki
        type: loki
        isDefault: false
      - id: 1
        uid: prometheus
        name: Prometheus
        type: prometheus
        isDefault: true
      - id: 4
        uid: pyroscope
        name: Pyroscope
        type: grafana-pyroscope-datasource
        isDefault: false
      - id: 2
        uid: tempo
        name: Tempo
        type: tempo
        isDefault: false
      total: 4
      hasMore: false
  grafana_list_loki_label_names:
  - match:
      datasourceUid: loki
    result:
    - service_name
    - service_namespace
  grafana_list_loki_label_values:
  - match:
      datasourceUid: loki
    result:
    - payments
    - storefront
  grafana_query_loki_stats:
  - match:
