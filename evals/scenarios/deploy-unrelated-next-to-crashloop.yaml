integrations:
- kubernetes
- runbooks
- incidents
namespace: orders
description: 'A deploy verification, recorded live on the kind demo (2026-10-20): a new, healthy deployment
  audit in namespace orders, next to orders-api, which was crash looping for an hour before it. The Hub''s
  look before the deploy saw orders-api failing, so the Check must pass: the crash loop is not this deploy''s
  doing.'
check:
  name: deploy:kind/orders
  prompt: 'Verify a deploy in namespace orders of cluster kind. These changed a few minutes ago:

    - deployment audit, revision 1

    Pass only if what changed is healthy now (every changed deployment has all its replicas ready on the
    new revision, its pods have not restarted since, no new warning events, nothing failing in its logs)
    and nothing else in the namespace started failing after the change. Something that was already failing
    the same way before the change is not this change''s doing: say so in the summary, but don''t fail
    the Check for it. Read the details of each change with recent_changes.

    At the Hub''s look just before the change, these were already failing: orders-api. Fail the Check
    for them only if the change made them fail in a new way.'
expect:
  passed: true
  keywords:
  - audit
  evidence:
  - - kubernetes_list_deployments
    - kubernetes_list_pods
    - kubernetes_describe_pod
    - kubernetes_describe_deployment
  max_tool_calls: 12
tools:
  kubernetes_list_deployments:
  - name: audit
    ready: 1/1
    updated: 1
    images:
    - registry.k8s.io/pause:3.10
    problems: []
  - name: inventory
    ready: 1/1
    updated: 1
    images:
    - python:3.12-alpine
    problems: []
  - name: orders-api
    ready: 0/1
    updated: 1
    images:
    - python:3.12-alpine
    problems:
    - type: Available
      reason: MinimumReplicasUnavailable
      message: Deployment does not have minimum availability.
  kubernetes_get_events:
  - type: Warning
    reason: BackOff
    object: Pod/orders-api-79cd5d49dc-28wnk
    message: Back-off restarting failed container app in pod orders-api-79cd5d49dc-28wnk_orders(fd09c9a8-4602-4f21-a5df-766dac771ec0)
    count: 55
    last_seen: 4m
  - type: Warning
    reason: Unhealthy
    object: Pod/inventory-b775d96fd-rmlvd
    message: 'Readiness probe failed: dial tcp 10.244.0.28:8080: connect: connection refused'
    count: 1
    last_seen: 11m
  - type: Warning
    reason: Unhealthy
    object: Pod/inventory-5f754fbc87-m2rjd
    message: 'Readiness probe failed: dial tcp 10.244.0.27:8080: connect: connection refused'
    count: 1
    last_seen: 14m
  kubernetes_list_pods:
  - name: audit-6cfdd68f8c-2xr5p
    phase: Running
    ready: 1/1
    restarts: 0
    containers:
      pause:
        running_since: 2m
    last_terminated: {}
    node: aiops-control-plane
    age: 2m
  - name: inventory-b775d96fd-rmlvd
    phase: Running
    ready: 1/1
    restarts: 0
    containers:
      app:
        running_since: 11m
    last_terminated: {}
    node: aiops-control-plane
    age: 11m
  - name: orders-api-79cd5d49dc-28wnk
    phase: Running
    ready: 0/1
    restarts: 17
    containers:
      app:
        waiting: CrashLoopBackOff
        message: back-off 5m0s restarting failed container=app pod=orders-api-79cd5d49dc-28wnk_orders(fd09c9a8-4602-4f21-a5df-766dac771ec0)
    last_terminated:
      app:
        terminated: Error
        exit_code: 1
        finished: 3m
        message: null
    node: aiops-control-plane
    age: 1h
  kubernetes_recent_changes:
  - when: 2m
    namespace: orders
    deployment: audit
    revision: '1'
    change: created
    diff: {}
  - when: 14m
    namespace: orders
    deployment: inventory
