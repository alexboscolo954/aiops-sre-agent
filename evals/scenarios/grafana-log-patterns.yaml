description: 'A Contract with Grafana only: payments charges fail, and only the logs say why, among noisier
  lines. Recorded from the kind demo''s LGTM stack (make lgtm).'
clusters: {}
integrations:
- name: grafana
  vendor: grafana
  tools:
    list_datasources: read
    list_loki_label_names: read
    list_loki_label_values: read
    query_loki_stats: read
    query_loki_patterns: read
    query_loki_logs: read
alert:
  status: firing
  commonLabels:
    alertname: PaymentsHighErrorRate
    service_name: payments
  alerts:
  - status: firing
    labels:
      alertname: PaymentsHighErrorRate
      service_name: payments
      severity: warning
    annotations:
      summary: 8% of POST /charge requests return 5xx over the last 10 minutes.
expect:
  category:
  - dependency_failure
  keywords:
  - fraud-check
  max_tool_calls: 10
tools:
  grafana_list_datasources:
  - match: {}
    result:
      datasources:
      - id: 3
        uid: loki
        name: Loki
        type: loki
        isDefault: false
      - id: 1
        uid: prometheus
        name: Prometheus
        type: prometheus
        isDefault: true
      - id: 4
        uid: pyroscope
        name: Pyroscope
        type: grafana-pyroscope-datasource
        isDefault: false
      - id: 2
        uid: tempo
        name: Tempo
        type: tempo
        isDefault: false
      total: 4
      hasMore: false
  grafana_list_loki_label_names:
  - match:
      datasourceUid: loki
    result:
    - service_name
    - service_namespace
  grafana_list_loki_label_values:
  - match:
      datasourceUid: loki
    result:
    - payments
    - storefront
  grafana_query_loki_stats:
  - match:
